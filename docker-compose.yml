services:
    bookstore:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: bookstore_php
        volumes:
            - .:/app
        working_dir: /app
        expose:
            - "9000"
        depends_on:
            database:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: bookstore_nginx
        ports:
            - "8000:80"
        volumes:
            - ".:/app:ro"
            - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
        depends_on:
            - bookstore

    database:
        image: postgres:16-alpine
        container_name: bookstore_db
        environment:
            POSTGRES_DB: bookstore
            POSTGRES_USER: readifyltd
            POSTGRES_PASSWORD: readifyltd
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "bookstore", "-U", "readifyltd"]
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - db-data:/var/lib/postgresql/data:rw

volumes:
    db-data:
